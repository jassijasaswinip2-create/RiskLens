```html
<!DOCTYPE html>
<html>
<head>
    <title>Risk Prediction - RiskLens</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
          rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
    radial-gradient(circle at top left,#2c2c2c,#111827);

}

/* Card */

.container{

    width:500px;

    background:rgba(32,32,32,.9);

    border-radius:25px;

    padding:45px;

    border:1px solid rgba(245,158,11,.5);

    box-shadow:
    0 0 25px rgba(245,158,11,.4);

    color:white;

}

.logo{

    text-align:center;

    font-size:50px;

    margin-bottom:15px;

}

h1{

    text-align:center;

    margin-bottom:35px;

    letter-spacing:2px;

}

/* Inputs */

.input-box{

    margin-bottom:25px;

}

label{

    display:block;

    margin-bottom:8px;

    color:#f59e0b;

    font-size:13px;

    letter-spacing:2px;

}

input{

    width:100%;

    padding:15px;

    background:#1f2937;

    color:white;

    border:none;

    border-radius:12px;

    outline:none;

    font-size:16px;

}

input:focus{

    border:1px solid #f59e0b;

}

/* Button */

button{

    width:100%;

    padding:16px;

    border:none;

    border-radius:15px;

    cursor:pointer;

    font-size:17px;

    font-weight:600;

    color:white;

    background:
    linear-gradient(
    90deg,
    #d97706,
    #f59e0b);

}

button:hover{

    box-shadow:
    0 0 20px #f59e0b;

}

/* Result */

.result{

    margin-top:30px;

    text-align:center;

    padding:20px;

    border-radius:15px;

    background:#1f2937;

}

.result h2{

    color:#f59e0b;

}

.back{

    text-align:center;

    margin-top:20px;

}

.back a{

    color:#f59e0b;

    text-decoration:none;

}

</style>

</head>
<body>

<div class="container">

<div class="logo">
🛡️
</div>

<h1>RISK PREDICTION</h1>

<form action="/risk" method="POST">

<div class="input-box">

<label>HOUR</label>

<input
type="number"
name="hour"
min="0"
max="23"
required>

</div>


<div class="input-box">

<label>DAY OF WEEK</label>

<input
type="number"
name="day"
min="0"
max="6"
required>

</div>


<div class="input-box">

<label>LOCATION CODE</label>

<select name="location">

<option value="0">Plant A</option>

<option value="1">Plant B</option>

<option value="2">Warehouse</option>

<option value="3">Office</option>

</select>

</div>

<button>

PREDICT RISK

</button>

</form>

{% if result %}

<div class="result">

<h2>

Prediction Result

</h2>

<br>

<h1>

{{ result }}

</h1>

</div>

{% endif %}


<div class="back">

<a href="{{ url_for('index') }}">

← Back to Dashboard

</a>

</div>

</div>

</body>
</html>
```
