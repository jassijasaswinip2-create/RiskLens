<!DOCTYPE html>
<html lang="en">

<head>

    <title>Profile</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{

            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #0F172A);

            color:white;

            min-height:100vh;

        }

        nav{

            display:flex;

            justify-content:space-between;

            align-items:center;

            padding:25px 50px;

            background:
                rgba(15,23,42,.8);

            backdrop-filter:blur(20px);

            border-bottom:
                1px solid rgba(245,158,11,.2);

        }

        nav h2{

            color:#F59E0B;

            font-size:32px;

        }

        .container{

            width:90%;

            margin:auto;

            padding-top:60px;

        }

        .profile-card{

            background:
                rgba(31,41,55,.85);

            padding:50px;

            border-radius:30px;

            text-align:center;

            box-shadow:
                0 0 25px rgba(245,158,11,.2);

            transition:.4s;

        }

        .profile-card:hover{

            transform:translateY(-10px);

            box-shadow:
                0 0 40px rgba(245,158,11,.4);

        }

        .avatar{

            width:140px;

            height:140px;

            border-radius:50%;

            background:#F59E0B;

            display:flex;

            justify-content:center;

            align-items:center;

            font-size:60px;

            margin:auto;

            margin-bottom:25px;

        }

        .username{

            font-size:40px;

            font-weight:700;

        }

        .email{

            margin-top:15px;

            font-size:18px;

            color:#CBD5E1;

        }

        .role{

            margin-top:20px;

            display:inline-block;

            padding:12px 25px;

            border-radius:20px;

            background:#10B981;

            font-size:18px;

        }

        .stats{

            display:flex;

            gap:30px;

            margin-top:50px;

            flex-wrap:wrap;

        }

        .stat-card{

            flex:1;

            min-width:250px;

            background:
                rgba(31,41,55,.85);

            padding:35px;

            border-radius:25px;

            text-align:center;

            box-shadow:
                0 0 20px rgba(56,189,248,.15);

            transition:.4s;

        }

        .stat-card:hover{

            transform:translateY(-10px);

        }

        .stat-card h2{

            color:#38BDF8;

            margin-bottom:20px;

        }

        .stat-card p{

            font-size:45px;

            font-weight:700;

            color:#F59E0B;

        }

        .btn{

            padding:15px 30px;

            background:
                linear-gradient(
                    90deg,
                    #F59E0B,
                    #D97706);

            border:none;

            border-radius:15px;

            font-size:18px;

            color:white;

            cursor:pointer;

            transition:.4s;

            margin-top:40px;

        }

        .btn:hover{

            transform:translateY(-5px);

            box-shadow:
                0 0 20px #F59E0B;

        }

        footer{

            margin-top:80px;

            padding:30px;

            text-align:center;

            background:#0F172A;

            color:#94A3B8;

        }

    </style>

</head>

<body>

    <nav>

        <h2>

            👤 User Profile

        </h2>

    </nav>

    <div class="container">

        <div class="profile-card">

            <div class="avatar">

                👤

            </div>

            <div class="username">

                {{ current_user.username }}

            </div>

            <div class="email">

                {{ current_user.email }}

            </div>

            <div class="role">

                {{ current_user.role }}

            </div>

        </div>

        <div class="stats">

            <div class="stat-card">

                <h2>

                    📊 Analyses

                </h2>

                <p>

                    {{ current_user.analyses_count }}

                </p>

            </div>

            <div class="stat-card">

                <h2>

                    📅 Joined

                </h2>

                <p>

                    {{ created_date }}

                </p>

            </div>

            <div class="stat-card">

                <h2>

                    🛡️ Role

                </h2>

                <p>

                    {{ current_user.role }}

                </p>

            </div>

        </div>

        <a href="{{ url_for('index') }}">

            <button class="btn">

                🏠 Dashboard

            </button>

        </a>

    </div>

    <footer>

        © 2026 RiskLens | AI Powered Employee Safety Analytics

    </footer>

</body>

</html>
