<!DOCTYPE html>

<html>

<head>

<title>Search Incidents</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:
linear-gradient(
135deg,
#111827,
#0F172A);

color:white;

}

/* NAVBAR */

nav{

padding:25px 50px;

background:
rgba(15,23,42,.8);

backdrop-filter:blur(20px);

border-bottom:
1px solid rgba(245,158,11,.2);

}

nav h2{

color:#F59E0B;

font-size:32px;

}

/* MAIN */

.container{

width:90%;

margin:auto;

padding-top:50px;

}

/* SEARCH BOX */

.search-box{

background:
rgba(31,41,55,.85);

padding:40px;

border-radius:30px;

box-shadow:
0 0 25px rgba(245,158,11,.15);

}

input,select{

width:100%;

padding:16px;

margin-top:15px;

margin-bottom:25px;

background:
rgba(255,255,255,.08);

border:
1px solid rgba(255,255,255,.15);

border-radius:15px;

color:white;

font-size:16px;

}

input:focus,
select:focus{

outline:none;

border-color:#F59E0B;

}

/* BUTTON */

.btn{

padding:15px 30px;

background:
linear-gradient(
90deg,
#F59E0B,
#D97706);

border:none;

border-radius:15px;

font-size:18px;

color:white;

cursor:pointer;

transition:.4s;

}

.btn:hover{

transform:
translateY(-5px);

box-shadow:
0 0 20px #F59E0B;

}

/* TABLE */

.table-box{

margin-top:50px;

background:
rgba(31,41,55,.85);

padding:40px;

border-radius:30px;

box-shadow:
0 0 20px rgba(56,189,248,.15);

}

table{

width:100%;

border-collapse:collapse;

}

th{

padding:18px;

background:#1E293B;

color:#38BDF8;

}

td{

padding:18px;

text-align:center;

border-bottom:
1px solid rgba(255,255,255,.1);

}

tr:hover{

background:
rgba(255,255,255,.05);

}

footer{

margin-top:80px;

padding:30px;

background:#0F172A;

text-align:center;

color:#94A3B8;

}

</style>

</head>

<body>

<nav>

<h2>

🔍 Search Incidents

</h2>

</nav>

<div class="container">

<div class="search-box">

<form method="POST">

<label>Date</label>

<input
type="date"
name="date">

<label>Location</label>

<input
type="text"
name="location"
placeholder="Factory">

<label>Severity</label>

<select name="severity">

<option value="">

All

</option>

<option>

Low

</option>

<option>

Medium

</option>

<option>

High

</option>

</select>

<button class="btn">

Search

</button>

</form>

</div>

<div class="table-box">

<h2>

📋 Search Results

</h2>

<br>

<table>

<tr>

<th>Date</th>

<th>Time</th>

<th>Location</th>

<th>Severity</th>

</tr>

{% for i in results %}

<tr>

<td>

{{i.date}}

</td>

<td>

{{i.time}}

</td>

<td>

{{i.location}}

</td>

<td>

{{i.severity}}

</td>

</tr>

{% endfor %}

</table>

</div>

<br>

<a href="{{ url_for('index') }}">

<button class="btn">

🏠 Home

</button>

</a>

<a href="{{ url_for('results') }}">

<button class="btn">

📊 Dashboard

</button>

</a>

</div>

<footer>

© 2026 RiskLens |
AI Powered Employee Safety Analytics

</footer>

</body>

</html>
