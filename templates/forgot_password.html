<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password | RiskLens</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

display:flex;
justify-content:center;
align-items:center;
height:100vh;

background:
linear-gradient(
135deg,
#0F172A,
#111827,
#1E293B);

background-size:400% 400%;
animation:gradient 10s ease infinite;

overflow:hidden;

}

@keyframes gradient{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}

.container{

width:450px;

padding:45px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.15);

border-radius:30px;

box-shadow:
0 0 35px rgba(245,158,11,.25);

animation:fadeIn 1s;

}

@keyframes fadeIn{

from{

opacity:0;
transform:translateY(50px);

}

to{

opacity:1;
transform:translateY(0);

}

}

.logo{

font-size:55px;

text-align:center;

margin-bottom:10px;

}

h1{

text-align:center;

color:#F59E0B;

margin-bottom:10px;

}

.subtitle{

text-align:center;

color:#CBD5E1;

margin-bottom:35px;

font-size:15px;

line-height:24px;

}

.input-box{

margin-bottom:25px;

}

label{

display:block;

margin-bottom:8px;

font-weight:600;

color:white;

}

input{

width:100%;

padding:16px;

border-radius:12px;

border:none;

font-size:16px;

background:rgba(255,255,255,.12);

color:white;

outline:none;

transition:.3s;

}

input::placeholder{

color:#CBD5E1;

}

input:focus{

box-shadow:
0 0 20px rgba(56,189,248,.6);

}

button{

width:100%;

padding:16px;

border:none;

border-radius:14px;

font-size:18px;

font-weight:600;

cursor:pointer;

background:
linear-gradient(
90deg,
#F59E0B,
#FB923C);

color:white;

transition:.35s;

}

button:hover{

transform:translateY(-5px);

box-shadow:
0 0 30px rgba(245,158,11,.55);

}

.links{

margin-top:25px;

text-align:center;

}

.links a{

color:#38BDF8;

text-decoration:none;

font-weight:600;

}

.links a:hover{

text-decoration:underline;

}

.flash{

background:#10B981;

padding:12px;

border-radius:10px;

margin-bottom:20px;

text-align:center;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

🔒

</div>

<h1>

Forgot Password

</h1>

<p class="subtitle">

Enter your registered email address.<br>

We'll help you reset your password.

</p>

{% with messages = get_flashed_messages(with_categories=true) %}

{% if messages %}

{% for category,message in messages %}

<div class="flash">

{{ message }}

</div>

{% endfor %}

{% endif %}

{% endwith %}

<form method="POST">

<div class="input-box">

<label>Email Address</label>

<input
type="email"
name="email"
placeholder="Enter registered email"
required>

</div>

<button type="submit">

📧 Send Reset Link

</button>

</form>

<div class="links">

<a href="{{ url_for('login') }}">

⬅ Back to Login

</a>

</div>

</div>

</body>

</html>
