<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Upload Dataset | RiskLens</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
            overflow:hidden;
        }

        body{

            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

             background:
                linear-gradient(
                    rgba(15,23,42,0.65),
                    rgba(15,23,42,0.75)
                ),
                url("{{ url_for('static', filename='i10.jpg') }}");

            background-size:100% 100%;


            overflow:hidden;

        }

        @keyframes gradientBG{

            0%{
                background-position:0% 50%;
            }

            50%{
                background-position:100% 50%;
            }

            100%{
                background-position:0% 50%;
            }

        }

        .container{

            width:550px;

            padding:45px;

            background:rgba(255,255,255,.08);

            backdrop-filter:blur(18px);

            border:1px solid rgba(255,255,255,.15);

            border-radius:30px;

            box-shadow:
                0 0 35px rgba(245,158,11,.25);

            animation:fade .8s;

        }

        @keyframes fade{

            from{

                opacity:0;

                transform:translateY(60px);

            }

            to{

                opacity:1;

                transform:translateY(0);

            }

        }

        .logo{

            font-size:60px;

            text-align:center;

            margin-bottom:10px;
            

        }


.logo img{
    width:105px;
    height:105px;
    object-fit:contain;
    border-radius:20px;
}

        h1{

            text-align:center;

            color:#F59E0B;

            margin-bottom:10px;

        }

        .subtitle{

            text-align:center;

            color:#CBD5E1;

            margin-bottom:35px;

            line-height:26px;

        }

        .upload-box{

            border:3px dashed #38BDF8;

            border-radius:20px;

            padding:40px;

            text-align:center;

            background:rgba(255,255,255,.05);

            transition:.4s;

            cursor:pointer;

        }

        .upload-box:hover{

            background:rgba(56,189,248,.08);

            box-shadow:
                0 0 25px rgba(56,189,248,.3);

        }

        .upload-box img{

            width:80px;

            margin-bottom:15px;

        }

        .upload-box h3{

            color:white;

            margin-bottom:10px;

        }

        .upload-box p{

            color:#CBD5E1;

            font-size:14px;

        }

        input[type="file"]{

            margin-top:20px;

            color:white;

            font-size:16px;

        }

        button{

            width:100%;

            margin-top:35px;

            padding:16px;

            border:none;

            border-radius:15px;

            background:
                linear-gradient(
                    90deg,
                    #F59E0B,
                    #FB923C);

            color:white;

            font-size:19px;

            font-weight:600;

            cursor:pointer;

            transition:.35s;

        }

        button:hover{

            transform:translateY(-5px);

            box-shadow:
                0 0 30px rgba(245,158,11,.55);

        }
        .features{

            display:flex;

            justify-content:space-between;

            margin-top:30px;

        }

        .feature{

            text-align:center;

            color:#CBD5E1;

            font-size:14px;

        }

        .feature span{

            display:block;

            font-size:28px;

            margin-bottom:8px;

        }

        .back{

            display:block;

            text-align:center;

            margin-top:30px;

            text-decoration:none;

            color:#38BDF8;

            font-weight:600;

        }

        .back:hover{

            text-decoration:underline;

        }

        #loadingScreen{

            position:fixed;

            inset:0;

            display:none;

            justify-content:center;

            align-items:center;

            background:#0F172A;

            z-index:99999;

            overflow:hidden;

        }

        .spinner{

            width:90px;

            height:90px;

            border:8px solid rgba(255,255,255,.2);

            border-top:8px solid #F59E0B;

            border-radius:50%;

            animation:spin 1s linear infinite;

            margin-bottom:30px;

        }

        .loader{

            display:flex;

            flex-direction:column;

            justify-content:center;

            align-items:center;

            text-align:center;

            width:100%;

            height:100%;
            background:
        linear-gradient(
            rgba(15,23,42,0.65),
            rgba(15,23,42,0.75)
        ),
        url("{{ url_for('static', filename='i2.jpg') }}");

        background-size:cover;
        background-position:center;
        background-attachment:fixed;
        background-repeat:no-repeat;

        color:white;

        }

        .loader h2{

            color:#F59E0B;

            margin-bottom:15px;

        }

        .loader p{

            color:white;

            font-size:20px;

        }

        @keyframes spin{

            100%{

                transform:rotate(360deg);

            }

        }


    </style>

</head>
<body>

    <div id="loadingScreen">

        <div class="loader">

            <div class="spinner"></div>

            <h2>

                RiskLens

            </h2>

            <p id="loadingText">

                Uploading Dataset...

            </p>

        </div>

    </div>

    <div class="container">

        <div class="logo">

            <img src="/static/i11.png" alt="">

        </div>

        <h1>

            Upload Safety Dataset

        </h1>

        <p class="subtitle">

            Upload your employee safety CSV file.<br>

            RiskLens will automatically analyze incidents,<br>

            generate charts, predict risks, and create reports.

        </p>

        <form
            id="uploadForm"
            action="{{ url_for('upload') }}"
            method="POST"
            enctype="multipart/form-data">

            <div class="upload-box">

                <img
                    src="https://cdn-icons-png.flaticon.com/512/2921/2921222.png"
                    alt="Upload">

                <h3>

                    Upload CSV File

                </h3>
                <input
                    type="file"
                    name="file"
                    accept=".csv"
                    required>

            </div>

            <button type="submit">

                Analyze Dataset

            </button>

        </form>

    <script>

        const form = document.getElementById("uploadForm");

        form.addEventListener("submit", function () {

            document.getElementById("loadingScreen").style.display = "flex";

            const messages = [

                "Uploading Dataset...",
                "Reading CSV File...",
                "Training Machine Learning Models...",
                "Creating Dashboard...",
                "Generating PDF Report...",
                "Almost Done..."

            ];

            let i = 0;

            const loadingText = document.getElementById("loadingText");

            const timer = setInterval(() => {

                i++;

                if (i < messages.length) {

                    loadingText.innerHTML = messages[i];

                } else {

                    clearInterval(timer);

                }

            }, 1000);

        });

    </script>

</body>

</html>
