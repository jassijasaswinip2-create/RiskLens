<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RiskLens</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;

            background:linear-gradient(
                rgba(15,23,42,0.8),
                rgba(15,23,42,0.8)
            ),
            url("{{ url_for('static', filename='i2.jpg') }}");

            background-size:cover;
            background-position:center;
        }

     .container{

            width:450px;

            background:white;

            padding:40px;

            border-radius:20px;

            box-shadow:0 10px 25px rgba(0,0,0,0.3);

        }

        .logo{
            text-align:center;
            font-size:40px;
            margin-bottom:10px;
        }

        h1{
            text-align:center;
            color:linear-gradient(
90deg,
#F59E0B,
#FB923C);;
            margin-bottom:30px;
        }

        .input-box{
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
        }

        input{
            width:100%;
            padding:14px;
            border:1px solid #ccc;
            border-radius:10px;
            font-size:16px;
        }

        input:focus{
            outline:none;
            border-color:#2563eb;
        }

        button{

            width:100%;
            padding:15px;

            background:
linear-gradient(
90deg,
#F59E0B,
#FB923C);

            color:white;

            border:none;

            border-radius:10px;

            font-size:18px;

            cursor:pointer;
        }

        button:hover{
            background:
linear-gradient(
90deg,
#F59E0B,
#FB923C);
            box-shadow:0 5px 15px rgba(0,0,0,0.2);
        }

       .bottom-text{

text-align:center;

margin-top:18px;

color:#CBD5E1;

font-size:15px;

}

.bottom-text a{

color:black;

text-decoration:none;

font-weight:600;

}

.bottom-text a:hover{

text-decoration:underline;

}
    </style>

</head>
<body>

<div class="container">

    <div class="logo">
        🛡️
    </div>

    <h1>RiskLens Login</h1>
<form method="POST">

    <div class="input-box">
        <label>Email</label>
        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required>
    </div>

    <div class="input-box">
        <label>Password</label>
        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required>
    </div>

    <button type="submit">
        Login
    </button>

</form>

<div class="bottom-text">
    Not registered yet?
    <a href="{{ url_for('register') }}">
        Create Account
    </a>
</div>

<div class="bottom-text">
    <a href="{{ url_for('forgot_password') }}">
        Forgot Password?
    </a>
</div>

</div>   <!-- ✅ Close container here -->


</body>
</html>
