<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password | RiskLens</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{

            display:flex;
            justify-content:center;
            align-items:center;

            height:100vh;

            background:
                linear-gradient(
                    -45deg,
                    #0F172A,
                    #111827,
                    #1E293B,
                    #0F172A);

            background-size:400% 400%;

            animation:bg 12s ease infinite;

        }

        @keyframes bg{

            0%{
                background-position:0% 50%;
            }

            50%{
                background-position:100% 50%;
            }

            100%{
                background-position:0% 50%;
            }

        }

        .container{

            width:450px;

            padding:45px;

            background:rgba(255,255,255,.08);

            backdrop-filter:blur(20px);

            border:1px solid rgba(255,255,255,.15);

            border-radius:30px;

            box-shadow:0 0 30px rgba(245,158,11,.25);

            animation:fade 1s;

        }

        @keyframes fade{

            from{

                opacity:0;
                transform:translateY(50px);

            }

            to{

                opacity:1;
                transform:translateY(0);

            }

        }

        .logo{

            text-align:center;

            font-size:55px;

            margin-bottom:10px;

        }

        h1{

            text-align:center;

            color:#F59E0B;

            margin-bottom:10px;

        }

        .subtitle{

            text-align:center;

            color:#CBD5E1;

            margin-bottom:30px;

            line-height:24px;

        }

        .input-box{

            margin-bottom:22px;

        }

        label{

            display:block;

            margin-bottom:8px;

            color:white;

            font-weight:600;

        }

        input{

            width:100%;

            padding:15px;

            border:none;

            border-radius:12px;

            background:rgba(255,255,255,.1);

            color:white;

            font-size:16px;

            outline:none;

        }

        input::placeholder{

            color:#CBD5E1;

        }

        input:focus{

            box-shadow:0 0 20px rgba(56,189,248,.6);

        }

        button{

            width:100%;

            padding:16px;

            border:none;

            border-radius:15px;

            background:
                linear-gradient(
                    90deg,
                    #10B981,
                    #059669);

            color:white;

            font-size:18px;

            font-weight:600;

            cursor:pointer;

            transition:.3s;

        }

        button:hover{

            transform:translateY(-5px);

            box-shadow:0 0 25px rgba(16,185,129,.5);

        }

        .links{

            margin-top:25px;

            text-align:center;

        }

        .links a{

            text-decoration:none;

            color:#38BDF8;

            font-weight:600;

        }

        .links a:hover{

            text-decoration:underline;

        }

        .flash{

            background:#10B981;

            padding:12px;

            border-radius:10px;

            margin-bottom:20px;

            text-align:center;

            color:white;

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="logo">

            🔑

        </div>

        <h1>

            Reset Password

        </h1>

        <p class="subtitle">

            Create a new secure password for your RiskLens account.

        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="flash">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}

        <form method="POST">

            <div class="input-box">

                <label>New Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter new password"
                    required>

            </div>

            <div class="input-box">

                <label>Confirm Password</label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    required>

            </div>

            <button type="submit">

                🔒 Update Password

            </button>

        </form>

        <div class="links">

            <a href="{{ url_for('login') }}">

                ⬅ Back to Login

            </a>

        </div>

    </div>

</body>

</html>
